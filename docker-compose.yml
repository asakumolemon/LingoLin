services:
  server:
    build:
      context: ./server
    container_name: lingolin-server
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      - DB_PATH=/app/data/lingolin.db
      - JWT_SECRET=${JWT_SECRET:-change-me-in-production}
      - STORE_PATH=/app/store
      - DEFAULT_ADMIN_PASSWORD=${DEFAULT_ADMIN_PASSWORD:-admin123}
    volumes:
      - lingolin-data:/app/data
      - lingolin-store:/app/store
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  web:
    build:
      context: ./web
    container_name: lingolin-web
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - server

volumes:
  lingolin-data:
  lingolin-store:
